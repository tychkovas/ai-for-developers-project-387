name: opencode-review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  review:
    # opencode (v1.19.4) в assertPermissions() проверяет context.actor и для
    # ботов всегда получает permission: none, из-за чего падают PR от ботов
    # (opencode-agent[bot]): "User opencode-agent[bot] does not have write
    # permissions" (upstream: anomalyco/opencode#17224, #23915).
    # Реальный ревью-запуск для таких PR запускается вручную комментарием /oc.
    if: >-
      github.actor != 'opencode-agent[bot]' &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Run opencode
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }} # имя секрета зависит от провайдера в model
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }} # нужен для Render MCP из opencode.json
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          model: opencode/deepseek-v4.1-flash
          use_github_token: true
          prompt: |
            Review this pull request:
            - Check for code quality issues
            - Look for potential bugs
            - Suggest improvements
            Все ответы, ревью и комментарии формируй только на русском языке.
            Комментарии и ревью — на русском. Сообщения коммитов и заголовки PR — строго Conventional Commits на английском: `<type>(<scope>): <description>`. Не переводи заголовок PR на русский: при squash-merge он становится сообщением коммита.
