name: opencode-review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  review:
    # opencode (v1.19.4) в assertPermissions() проверяет context.actor и для
    # ботов всегда получает permission: none, из-за чего падают прогоны на
    # pull_request от PR, открытых ботом (opencode-agent[bot],
    # github-actions[bot]): "does not have write permissions"
    # (upstream: anomalyco/opencode#17224, #23915). Для таких PR то же ревью
    # запускается вручную комментарием /oc (событие issue_comment, actor — человек).
    if: >-
      github.actor != 'opencode-agent[bot]' &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    # Ревью только читает diff и пишет комментарии к PR (через issues API),
    # не коммитит и не пушит. id-token не нужен: use_github_token: true
    # пропускает OIDC-обмен и использует токен раннера.
    permissions:
      contents: read
      pull-requests: read
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Run opencode
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }} # имя секрета зависит от провайдера в model
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }} # нужен для Render MCP из opencode.json
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          model: opencode/deepseek-v4.1-flash
          use_github_token: true
          prompt: |
            Сделай ревью этого pull request и оставь замечания комментарием к PR.
            Ничего не коммить и не пушь — только чтение и комментарии.
            Критерии ревью:
            - UI только на Mantine: нет самописных стилей/компонентов там, где есть готовое решение в @mantine/core, @mantine/hooks, @mantine/dates, @mantine/form
            - Проверки через make lint / make build / make test (oxlint, не eslint)
            - Потенциальные баги, граничные случаи, нарушения типов
            - Замечания к стилю, типам и очевидным ошибкам
            Все ответы, объяснения и ревью формируй только на русском языке.
