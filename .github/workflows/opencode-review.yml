name: opencode-review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  review:
    # DISABLED: заменён на cursor-review.yml. Убери `false &&` чтобы снова включить.
    # Ограничение на этом аккаунте: use_github_token даёт 403 на комментарии к PR;
    # ревью через OIDC + GitHub App opencode-agent. PR ботов пропускаются
    # (anomalyco/opencode#17224, #23915) — для них /opencode или /oc.
    # Событие pull_request: смотрим sender/actor, а не comment.user.
    if: >-
      false &&
      github.event.sender.type != 'Bot' &&
      !contains(github.actor, 'opencode')
    runs-on: ubuntu-latest
    # Ревью только читает код и оставляет комментарии (токен приложения выдаётся
    # через OIDC), ничего не коммитит и не пушит.
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Run opencode
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }} # имя секрета зависит от провайдера в model
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }} # нужен для Render MCP из opencode.json
        with:
          model: opencode/deepseek-v4.1-flash
          prompt: |
            Сделай ревью этого pull request и оставь замечания комментарием к PR.
            Ничего не коммить и не пушь — только чтение и комментарии.
            Критерии ревью:
            - UI только на Mantine: нет самописных стилей/компонентов там, где есть готовое решение в @mantine/core, @mantine/hooks, @mantine/dates, @mantine/form
            - Проверки через make lint / make build / make test (oxlint, не eslint)
            - Потенциальные баги, граничные случаи, нарушения типов
            - Замечания к стилю, типам и очевидным ошибкам
            Все ответы, объяснения и ревью формируй только на русском языке.
