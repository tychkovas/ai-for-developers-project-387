name: opencode-review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  review:
    # opencode (v1.19.4) в assertPermissions() проверяет context.actor и для
    # ботов всегда получает permission: none, из-за чего падают PR от ботов
    # (opencode-agent[bot]): "User opencode-agent[bot] does not have write
    # permissions" (upstream: anomalyco/opencode#17224, #23915).
    # Реальный ревью-запуск для таких PR запускается вручную комментарием /oc.
    if: >-
      github.actor != 'opencode-agent[bot]' &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Record HEAD before opencode
        id: before
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.issue.pull_request && github.event.issue.number }}
        run: |
          if [ -n "$PR_HEAD_SHA" ]; then
            sha="$PR_HEAD_SHA"
          elif [ -n "$PR_NUMBER" ]; then
            sha=$(gh api "repos/${{ github.repository }}/pulls/$PR_NUMBER" --jq .head.sha)
          else
            sha=$(git rev-parse HEAD)
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Run opencode
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }} # имя секрета зависит от провайдера в model
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }} # нужен для Render MCP из opencode.json
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          model: opencode/deepseek-v4.1-flash
          use_github_token: true
          prompt: |
            Review this pull request:
            - Check for code quality issues
            - Look for potential bugs
            - Suggest improvements
            Все ответы, объяснения, ревью и комментарии формируй только на русском языке.
            Автоматическое короткое summary, commit subject и PR title MUST be in English and follow Conventional Commits: `<type>: <subject>` (feat, fix, chore, docs, refactor, test, ci, build, style, perf, revert). Не используй русский язык в commit subject, PR title и автоматическом summary.

      - name: Normalize opencode commit and PR title
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          BASE_HEAD: ${{ steps.before.outputs.sha }}
          ISSUE_NUMBER: ${{ github.event.pull_request.number }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: node scripts/normalize-opencode-commit.mjs
