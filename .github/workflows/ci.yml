name: ci

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  lint-build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test (vitest + smoke)
        run: npm run test

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: "Generation freshness (make generate == committed artifacts)"
        run: make generate && test -z "$(git status --porcelain -- docs/openapi.yaml src/api server)"
