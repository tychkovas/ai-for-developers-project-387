name: ci

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  lint-build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint commit messages
        if: github.event_name == 'push'
        shell: bash
        run: |
          from="${{ github.event.before }}"
          to="${{ github.event.after }}"
          if [ -z "$from" ] || [ "$from" = "0000000000000000000000000000000000000000" ]; then
            from="$(git rev-list --max-parents=0 "$to")"
          fi
          make commitlint FROM="$from" TO="$to"

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test (vitest + smoke)
        run: npm run test

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: "Generation freshness (make generate == committed artifacts)"
        run: make generate && test -z "$(git status --porcelain -- docs/openapi.yaml src/api server)"
