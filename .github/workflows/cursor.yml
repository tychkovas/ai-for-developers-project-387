name: cursor

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  cursor:
    if: |
      github.event.sender.type != 'Bot' &&
      !contains(github.event.comment.user.login, '[bot]') &&
      (
        github.event.comment.author_association == 'OWNER' ||
        github.event.comment.author_association == 'MEMBER' ||
        github.event.comment.author_association == 'COLLABORATOR'
      ) &&
      (
        contains(github.event.comment.body, ' /oc') ||
        startsWith(github.event.comment.body, '/oc') ||
        contains(github.event.comment.body, ' /opencode') ||
        startsWith(github.event.comment.body, '/opencode') ||
        contains(github.event.comment.body, ' /cursor') ||
        startsWith(github.event.comment.body, '/cursor') ||
        contains(github.event.comment.body, ' /cu') ||
        startsWith(github.event.comment.body, '/cu')
      )
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      reactions: write
    steps:
      - name: Acknowledge with eyes reaction
        id: eyes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          COMMENT_ID: ${{ github.event.comment.id }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if [ "$EVENT_NAME" = "issue_comment" ]; then
            path="/repos/${REPOSITORY}/issues/comments/${COMMENT_ID}/reactions"
          else
            path="/repos/${REPOSITORY}/pulls/comments/${COMMENT_ID}/reactions"
          fi
          echo "path=$path" >> "$GITHUB_OUTPUT"
          rid=$(gh api --method POST \
            -H "Accept: application/vnd.github+json" \
            "$path" \
            -f content='eyes' \
            --jq .id)
          echo "reaction_id=$rid" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Install Cursor CLI
        run: |
          curl -fsSL https://cursor.com/install | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/.cursor/bin" >> "$GITHUB_PATH"

      - name: Run Cursor Agent
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          ISSUE_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          REPOSITORY: ${{ github.repository }}
        run: |
          {
            echo "Ты — автономный агент Cursor в GitHub Actions для репозитория ${REPOSITORY}."
            echo "Есть полный доступ к git, gh и рабочей копии. Можешь коммитить, пушить и открывать PR."
            echo "При необходимости используй Render MCP / API с RENDER_API_KEY."
            echo ""
            echo "Контекст:"
            echo "- Issue/PR #${ISSUE_NUMBER}"
            echo "- Заголовок: ${ISSUE_TITLE}"
            echo "- Описание:"
            echo "${ISSUE_BODY}"
            echo ""
            echo "- Комментарий, который тебя вызвал:"
            echo "${COMMENT_BODY}"
            echo ""
            echo "Правила:"
            echo "- Все ответы и комментарии — только на русском."
            echo "- Commit subject и PR title — английский Conventional Commits: <type>: <subject>."
            echo "- UI только на Mantine; проверки через make lint / make build / make test."
            echo "- В конце оставь комментарий к issue/PR через gh с кратким итогом на русском."
          } > /tmp/cursor-prompt.txt

          agent -p "$(cat /tmp/cursor-prompt.txt)" \
            --model composer-2.5 \
            --trust \
            --force \
            --approve-mcps \
            --output-format text

      - name: Remove eyes reaction
        if: always() && steps.eyes.outputs.reaction_id != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REACTION_PATH: ${{ steps.eyes.outputs.path }}
          REACTION_ID: ${{ steps.eyes.outputs.reaction_id }}
        run: |
          gh api --method DELETE \
            -H "Accept: application/vnd.github+json" \
            "${REACTION_PATH}/${REACTION_ID}" || true
