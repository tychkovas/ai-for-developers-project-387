name: Weekly Lighthouse Audit (Cursor)

on:
  schedule:
    - cron: '0 21 * * 1' # Понедельник, 21:00
      timezone: Asia/Dubai
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      actions: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Warm up Render service
        run: |
          for i in $(seq 1 10); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "${{ vars.APP_URL }}" || true)
            [ "$code" = "200" ] && break
            sleep 10
          done

      - name: Run Lighthouse Healthcheck
        run: |
          npx @lhci/cli@0.13.0 collect --url="${{ vars.APP_URL }}" --numberOfRuns=1
          npx @lhci/cli@0.13.0 upload --target=filesystem --outputDir=./lhci-report

      - name: Save Lighthouse Report as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report
          path: ./lhci-report/

      - name: Install Cursor CLI
        run: |
          curl -fsSL https://cursor.com/install | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/.cursor/bin" >> "$GITHUB_PATH"

      - name: Run Cursor Agent
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "В папке ./lhci-report находится свежий отчет Lighthouse о проверке скорости страниц приложения."
            echo "Твоя задача — проанализировать эти сырые данные и создать новый issue в этом репозитории с итогами проверки через gh."
            echo "В описании задачи перечисли ключевые метрики, укажи найденные проблемы (если они есть) и сформируй чек-лист для их исправления."
            echo "ОБЯЗАТЕЛЬНО: Формируй ответ и создавай issue строго на русском языке."
            echo "Ничего не коммить."
          } > /tmp/cursor-prompt.txt

          agent -p "$(cat /tmp/cursor-prompt.txt)" \
            --model composer-2.5 \
            --trust \
            --force \
            --output-format text
