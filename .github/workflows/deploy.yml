name: Render deploy check

# autoDeploy в render.yaml уже запускает деплой на push в main; этот workflow
# по запросу проверяет результат последнего деплоя через Render MCP и
# диагностирует сбои.
#
# Событие push не поддерживается opencode GitHub Action
# ("Unsupported event type: push"), поэтому запуск только вручную.
# Для быстрой реакции на падение деплоя (письмо от Render) можно не запускать
# этот workflow, а написать /opencode или /oc в issue: в opencode.yml агент тоже видит
# render-инструменты и ответит диагностикой комментарием.
on:
  workflow_dispatch:

jobs:
  render-agent:
    # DISABLED: заменён Cursor CLI workflow'ом. Убери `if: false` чтобы снова включить.
    if: false
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Run opencode
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        with:
          model: opencode/deepseek-v4.1-flash
          prompt: |
            Используй инструменты render (Render MCP) для веб-сервиса ai-for-developers-project-387
            (serviceId: srv-dbef5v67bikc7388h4kg):
            1. list_deploys — найди самый свежий деплой сервиса.
            2. Проверь его статус через get_deploy.
            3. Если деплой упал — разбери причину через list_events (build_ended, server_failed и т.п.)
               и list_logs, сформулируй диагностику и рекомендации по исправлению.
            4. trigger_deploy вызывай только если на main есть коммит свежее последнего успешного
               деплоя и автодеплой его не подхватил; в остальных случаях деплой не трогай.
            Все ответы, отчёты и комментарии формируй только на русском языке.
            Автоматическое короткое summary, commit subject и PR title MUST be in English and follow Conventional Commits: `<type>: <subject>` (feat, fix, chore, docs, refactor, test, ci, build, style, perf, revert). Не используй русский язык в commit subject, PR title и автоматическом summary.
