name: Render deploy check (Cursor)

# autoDeploy в render.yaml уже запускает деплой на push в main; этот workflow
# по запросу проверяет результат последнего деплоя через Render API/MCP и
# диагностирует сбои.
on:
  workflow_dispatch:

jobs:
  render-agent:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Cursor CLI
        run: |
          curl -fsSL https://cursor.com/install | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/.cursor/bin" >> "$GITHUB_PATH"

      - name: Run Cursor deploy check
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "Используй инструменты Render (API/MCP) для веб-сервиса ai-for-developers-project-387"
            echo "(serviceId: srv-dbef5v67bikc7388h4kg):"
            echo "1. list_deploys — найди самый свежий деплой сервиса."
            echo "2. Проверь его статус через get_deploy."
            echo "3. Если деплой упал — разбери причину через list_events и list_logs,"
            echo "   сформулируй диагностику и рекомендации по исправлению."
            echo "4. trigger_deploy вызывай только если на main есть коммит свежее последнего успешного"
            echo "   деплоя и автодеплой его не подхватил; в остальных случаях деплой не трогай."
            echo "Все ответы, отчёты и комментарии формируй только на русском языке."
            echo "Ничего не коммить."
          } > /tmp/cursor-prompt.txt

          agent -p "$(cat /tmp/cursor-prompt.txt)" \
            --model composer-2.5 \
            --trust \
            --force \
            --output-format text
