name: opencode

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  opencode:
    # Комментарий агента — тоже issue_comment. Без фильтра по отправителю
    # ответ с /opencode или /oc снова ставит этот job в очередь.
    # author_association: публичный репозиторий, звать агента могут только
    # владелец, участник организации и явные коллабораторы. CONTRIBUTOR
    # не входит: это любой, у кого уже есть коммит.
    if: |
      github.event.sender.type != 'Bot' &&
      !contains(github.event.comment.user.login, 'opencode') &&
      (
        github.event.comment.author_association == 'OWNER' ||
        github.event.comment.author_association == 'MEMBER' ||
        github.event.comment.author_association == 'COLLABORATOR'
      ) &&
      (
        contains(github.event.comment.body, ' /oc') ||
        startsWith(github.event.comment.body, '/oc') ||
        contains(github.event.comment.body, ' /opencode') ||
        startsWith(github.event.comment.body, '/opencode')
      )
    runs-on: ubuntu-latest
    # contents и pull-requests: write — агент коммитит и открывает PR,
    # а scripts/normalize-opencode-commit.mjs при сбое OIDC пушит и
    # правит заголовок PR токеном раннера. issues агент здесь не создаёт.
    permissions:
      id-token: write
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Record HEAD before opencode
        id: before
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.issue.pull_request && github.event.issue.number }}
        run: |
          if [ -n "$PR_HEAD_SHA" ]; then
            sha="$PR_HEAD_SHA"
          elif [ -n "$PR_NUMBER" ]; then
            sha=$(gh api "repos/${{ github.repository }}/pulls/$PR_NUMBER" --jq .head.sha)
          else
            sha=$(git rev-parse HEAD)
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Run opencode
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }} # имя секрета зависит от провайдера в model
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }} # нужен для Render MCP из opencode.json
        with:
          model: opencode/glm-5.3-flash
          mentions: /opencode,/oc
          prompt: |
            Analyze the issue or pull request. Все ответы, объяснения, ревью и комментарии формируй только на русском языке.
            Автоматическое короткое summary, commit subject и PR title MUST be in English and follow Conventional Commits: `<type>: <subject>` (feat, fix, chore, docs, refactor, test, ci, build, style, perf, revert). Не используй русский язык в commit subject, PR title и автоматическом summary.

      - name: Normalize opencode commit and PR title
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          BASE_HEAD: ${{ steps.before.outputs.sha }}
          ISSUE_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: node scripts/normalize-opencode-commit.mjs
