name: probe-token-permissions
on:
  pull_request:
    types: [opened, synchronize]

jobs:
  probe:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Try issue comment via GITHUB_TOKEN
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          echo '=== POST /issues/$PR/comments ==='
          curl -s -o /tmp/c.json -w '%{http_code}\n' -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/issues/$PR/comments" \
            -d '{"body":"probe: check GITHUB_TOKEN issue-comment capability"}'
          head -c 300 /tmp/c.json; echo
          echo '=== POST /issues/$PR/reactions ==='
          curl -s -o /tmp/r.json -w '%{http_code}\n' -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/issues/$PR/reactions" \
            -d '{"content":"rocket"}'
          head -c 300 /tmp/r.json; echo
