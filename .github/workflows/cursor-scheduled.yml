name: Scheduled Cursor Task

on:
  schedule:
    - cron: "0 9 * * 1" # Every Monday at 9am UTC

jobs:
  cursor:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Cursor CLI
        run: |
          curl -fsSL https://cursor.com/install | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/.cursor/bin" >> "$GITHUB_PATH"

      - name: Run Cursor scheduled review
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "Review the codebase for any TODO comments and create a summary."
            echo "If you find issues worth addressing, open an issue to track them via gh."
            echo "Все ответы, объяснения, ревью и комментарии формируй только на русском языке."
            echo "Автоматическое короткое summary, commit subject и PR title MUST be in English and follow Conventional Commits."
            echo "Ничего не коммить и не открывай PR — только issue при необходимости."
          } > /tmp/cursor-prompt.txt

          agent -p "$(cat /tmp/cursor-prompt.txt)" \
            --model composer-2.5 \
            --trust \
            --force \
            --output-format text
