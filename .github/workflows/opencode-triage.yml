name: Issue Triage

on:
  issues:
    types: [opened]

jobs:
  triage:
    # Тот же upstream-баг assertPermissions(): для issue, созданных ботом
    # (например, nightly-audit), проверка context.actor падает с
    # "does not have write permissions" (anomalyco/opencode#17224, #23915).
    # Событие issues, не комментарий: comment.user здесь нет.
    if: >-
      github.event.sender.type != 'Bot' &&
      !contains(github.actor, 'opencode')
    runs-on: ubuntu-latest
    # Комментарий к issue оставляет токен приложения (OIDC). Раннеру запись не нужна:
    # шаг про возраст аккаунта ходит в публичный users API.
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Check account age
        id: check
        uses: actions/github-script@v7
        with:
          script: |
            const user = await github.rest.users.getByUsername({
              username: context.payload.issue.user.login
            });
            const created = new Date(user.data.created_at);
            const days = (Date.now() - created) / (1000 * 60 * 60 * 24);
            return days >= 30;
          result-encoding: string

      - name: Checkout repository
        if: steps.check.outputs.result == 'true'
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Run opencode
        if: steps.check.outputs.result == 'true'
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }} # имя секрета зависит от провайдера в model
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }} # нужен для Render MCP из opencode.json
        with:
          model: opencode/glm-5.3-flash
          prompt: |
            Review this issue. If there's a clear fix or relevant docs:
            - Provide documentation links
            - Add error handling guidance for code examples
            Otherwise, do not comment.
            Все ответы, объяснения, ревью и комментарии формируй только на русском языке.
            Автоматическое короткое summary, commit subject и PR title MUST be in English and follow Conventional Commits: `<type>: <subject>` (feat, fix, chore, docs, refactor, test, ci, build, style, perf, revert). Не используй русский язык в commit subject, PR title и автоматическом summary.
