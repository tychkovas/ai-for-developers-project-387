name: Nightly Lighthouse Audit

on:
  schedule:
    - cron: '0 18 * * *' # 18:00 UTC (21:00 / 9 вечера по Москве)
  workflow_dispatch: # Позволяет запускать проверку вручную

jobs:
  audit:
    runs-on: ubuntu-latest
    # Агент создаёт issue с отчётом (issues: write) и не коммитит.
    # actions: write нужен шагу upload-artifact, не агенту.
    # Расписание и workflow_dispatch не смотрят на комментарии — петли нет.
    # workflow_dispatch доступен тем, у кого есть право запускать Actions.
    permissions:
      id-token: write
      contents: read
      issues: write
      actions: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Warm up Render service
        # Бесплатный Render засыпает без запросов: прогреваем сервис перед замером,
        # иначе Lighthouse может замерить холодный старт (до 60 с) или словить 503.
        run: |
          for i in $(seq 1 10); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "${{ vars.APP_URL }}" || true)
            [ "$code" = "200" ] && break
            sleep 10
          done

      - name: Run Lighthouse Healthcheck
        run: |
          npx @lhci/cli@0.13.0 collect --url="${{ vars.APP_URL }}" --numberOfRuns=1
          npx @lhci/cli@0.13.0 upload --target=filesystem --outputDir=./lhci-report

      - name: Save Lighthouse Report as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report
          path: ./lhci-report/

      - name: Run OpenCode Agent
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        with:
          model: opencode/glm-5.3-flash
          prompt: |
            В папке ./lhci-report находится свежий отчет Lighthouse о проверке скорости страниц приложения.
            Твоя задача — проанализировать эти сырые данные и создать новый issue в этом репозитории с итогами проверки.
            В описании задачи перечисли ключевые метрики, укажи найденные проблемы (если они есть) и сформируй чек-лист для их исправления.
            ОБЯЗАТЕЛЬНО: Формируй ответ и создавай issue строго на русском языке.
