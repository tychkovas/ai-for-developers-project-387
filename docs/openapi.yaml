openapi: 3.0.0
info:
  title: Календарь звонков
  version: 0.0.0
tags:
  - name: EventTypes
  - name: Slots
  - name: Bookings
paths:
  /bookings:
    post:
      operationId: createBooking
      description: Создание записи на выбранный слот (спека, раздел 6.4). Конец вычисляется из длительности типа события. Занятый или прошедший слот — 409.
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
        '400':
          description: 'Валидация полей тела запроса (спека 6.4: «Введите имя», «Введите корректный email»).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '404':
          description: 'Неизвестный id типа события или записи (спека: неизвестный slug → каталог, невалидный slot → назад).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
        '409':
          description: 'Конфликт: дубль id типа события (спека 6.6) или занятый/прошедший слот при создании записи.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConflictError'
      tags:
        - Bookings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBooking'
    get:
      operationId: listBookings
      description: 'Панель «Предстоящие события» (спека, раздел 6.6): один список записей всех типов. Сортировка — по возрастанию начала. upcoming=true — только записи, чей конец позже текущего момента.'
      parameters:
        - name: upcoming
          in: query
          required: false
          schema:
            type: boolean
          explode: false
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Booking'
      tags:
        - Bookings
  /bookings/{id}:
    delete:
      operationId: cancelBooking
      description: 'Отмена записи: полное удаление, слот мгновенно освобождается (спека, раздел 6.6).'
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: 'There is no content to send for this request, but the headers may be useful. '
        '404':
          description: 'Неизвестный id типа события или записи (спека: неизвестный slug → каталог, невалидный slot → назад).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
      tags:
        - Bookings
  /event-types:
    get:
      operationId: getEventTypes
      description: Каталог типов события (спека, раздел 6.2). Порядок — по возрастанию длительности.
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EventType'
      tags:
        - EventTypes
    post:
      operationId: createEventType
      description: Создание типа события владельцем календаря из админки (спека, раздел 6.6). Правка и удаление — вне скоупа. Некорректные поля — 400, дубль id — 409.
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventType'
        '400':
          description: 'Валидация полей тела запроса (спека 6.4: «Введите имя», «Введите корректный email»).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '409':
          description: 'Конфликт: дубль id типа события (спека 6.6) или занятый/прошедший слот при создании записи.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConflictError'
      tags:
        - EventTypes
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEventType'
  /event-types/{id}:
    get:
      operationId: getEventType
      description: Тип события по идентификатору (спека, раздел 6.3). Неизвестный id — 404.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventType'
        '404':
          description: 'Неизвестный id типа события или записи (спека: неизвестный slug → каталог, невалидный slot → назад).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
      tags:
        - EventTypes
  /event-types/{id}/slots:
    get:
      operationId: getAvailableSlots
      description: Свободные слоты выбранного дня для типа события (спека, раздел 6.3). Включаются только рабочие дни в 14-дневном окне, не ближе часа от текущего момента и не занятые записями.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: date
          in: query
          required: true
          schema:
            type: string
            format: date
          explode: false
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Slot'
        '404':
          description: 'Неизвестный id типа события или записи (спека: неизвестный slug → каталог, невалидный slot → назад).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
      tags:
        - Slots
components:
  schemas:
    Booking:
      type: object
      required:
        - id
        - eventTypeId
        - start
        - end
        - guestName
        - guestEmail
      properties:
        id:
          type: string
          description: Идентификатор записи.
        eventTypeId:
          type: string
          description: Идентификатор типа события (EventType.id).
        start:
          type: string
          format: date-time
          description: Начало записи, ISO 8601 со смещением локального времени.
        end:
          type: string
          format: date-time
          description: 'Конец записи: начало плюс длительность типа события. Вычисляется при создании.'
        guestName:
          type: string
          description: Имя гостя, непустое.
        guestEmail:
          type: string
          description: Email гостя, проверяется формат.
      description: 'Запись (спека, раздел 8): гость записан на слот типа события.'
    ConflictError:
      type: object
      allOf:
        - $ref: '#/components/schemas/Error'
      description: 'Конфликт: дубль id типа события (спека 6.6) или занятый/прошедший слот при создании записи.'
    CreateBooking:
      type: object
      required:
        - eventTypeId
        - start
        - guestName
        - guestEmail
      properties:
        eventTypeId:
          type: string
          description: Идентификатор типа события (EventType.id).
        start:
          type: string
          format: date-time
          description: Начало выбранного слота, ISO 8601 со смещением.
        guestName:
          type: string
          description: Имя гостя, непустое.
        guestEmail:
          type: string
          description: Email гостя, проверяется формат.
      description: 'Тело создания записи (спека, раздел 6.4): гость приходит с выбранным слотом, end вычисляется.'
    CreateEventType:
      type: object
      required:
        - id
        - name
        - description
        - durationMinutes
      properties:
        id:
          type: string
          description: Уникальный идентификатор (латиница, цифры, дефис).
        name:
          type: string
          description: Название типа события.
        description:
          type: string
          description: Описание типа события.
        durationMinutes:
          type: integer
          format: int32
          description: Длительность в минутах.
      description: 'Тело создания типа события (спека, раздел 4): все поля, без вложенных структур.'
    Error:
      type: object
      required:
        - code
        - message
      properties:
        code:
          allOf:
            - $ref: '#/components/schemas/ErrorCode'
          description: Машиночитаемый код ошибки.
        message:
          type: string
          description: Человекочитаемое сообщение на русском, пригодное для показа в UI.
      description: 'Общая схема ошибки: машиночитаемый код + русское человекочитаемое сообщение.'
    ErrorCode:
      type: string
      enum:
        - not_found
        - validation_failed
        - id_taken
        - slot_taken
      description: 'Машиночитаемый код ошибки: для программной ветки; сообщения для людей — русские.'
    EventType:
      type: object
      required:
        - id
        - name
        - description
        - durationMinutes
      properties:
        id:
          type: string
          description: Уникальный идентификатор (латиница, цифры, дефис). На фронте — слаг роута /book/:id.
        name:
          type: string
          description: Название, например «Встреча 15 минут».
        description:
          type: string
          description: Описание для карточки в каталоге типов события.
        durationMinutes:
          type: integer
          format: int32
          description: 'Длительность в минутах. Сетка слотов — 15 минут: тип занимает ⌈durationMinutes / 15⌉ соседних слотов.'
      description: 'Тип события: данные, которые владелец календаря создаёт в админке (спека, раздел 4).'
    NotFoundError:
      type: object
      allOf:
        - $ref: '#/components/schemas/Error'
      description: 'Неизвестный id типа события или записи (спека: неизвестный slug → каталог, невалидный slot → назад).'
    Slot:
      type: object
      required:
        - start
        - end
      properties:
        start:
          type: string
          format: date-time
          description: Начало слота, ISO 8601 со смещением локального времени.
        end:
          type: string
          format: date-time
          description: 'Конец слота: начало плюс длительность типа события.'
      description: 'Свободный слот для записи (спека, раздел 3): интервал в локальном времени, ISO 8601 со смещением.'
    ValidationError:
      type: object
      allOf:
        - $ref: '#/components/schemas/Error'
      description: 'Валидация полей тела запроса (спека 6.4: «Введите имя», «Введите корректный email»).'
